name: Build & Deploy to FTP

# Staging: push a la rama `staging` (o disparo manual sobre esa rama) despliega a
# fiberlux.pe/staging/. La rama `main` (producción) NO dispara aún — mientras el
# WordPress viva en el dominio. En el cutover se añade `main` con su server-dir.
on:
  push:
    branches: [staging]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          # Site key pública de Cloudflare Turnstile: Vite la inlinea en el build (SPEC 79).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # En staging el sitio se sirve bajo /staging/; en cualquier otra rama, raíz.
          DEPLOY_BASE: ${{ github.ref_name == 'staging' && '/staging' || '' }}

      # Genera dist/config.local.php (NO versionado) con los secretos del backend
      # PHP. Se escribe DESPUÉS del build (que crea dist/) y ANTES del deploy FTP.
      # Escape seguro para claves con caracteres especiales (#, !, $, ', \, …).
      - name: Generate config.local.php from secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FALLBACK: ${{ secrets.MAIL_FALLBACK }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          php_escape() {
            local s=$1
            s=${s//\\/\\\\}   # \ -> \\
            s=${s//\'/\\\'}   # ' -> \'
            printf '%s' "$s"
          }
          {
            echo "<?php"
            echo "return ["
            echo "  'SMTP_USER'      => '$(php_escape "$SMTP_USER")',"
            echo "  'SMTP_PASS'      => '$(php_escape "$SMTP_PASS")',"
            echo "  'FALLBACK_EMAIL' => '$(php_escape "$MAIL_FALLBACK")',"
            echo "  'PANEL_USER'     => '$(php_escape "$PANEL_USER")',"
            echo "  'PANEL_PASS'     => '$(php_escape "$PANEL_PASS")',"
            echo "  'TURNSTILE_SECRET' => '$(php_escape "$TURNSTILE_SECRET")',"
            echo "];"
          } > dist/config.local.php

      # Deploy por SFTP (el servidor es SFTP/puerto 22, no FTP).
      # Sube el contenido de dist/ al remote_path. delete_remote_files=false:
      # NO borra archivos del servidor → data/ (submissions, counter) y uploads/
      # (adjuntos) creados en runtime se conservan siempre.
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 22
          local_path: './dist/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftp_only: true
          delete_remote_files: false
