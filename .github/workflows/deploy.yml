name: Build & Deploy to FTP

# Staging: push a la rama `staging` (o disparo manual sobre esa rama) despliega a
# fiberlux.pe/staging/. La rama `main` (producción) NO dispara aún — mientras el
# WordPress viva en el dominio. En el cutover se añade `main` con su server-dir.
on:
  push:
    branches: [staging]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          # Site key pública de Cloudflare Turnstile: Vite la inlinea en el build (SPEC 79).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # En staging el sitio se sirve bajo /staging/; en cualquier otra rama, raíz.
          DEPLOY_BASE: ${{ github.ref_name == 'staging' && '/staging' || '' }}

      # Los secretos del backend PHP viven ahora en fiberlux-config.php, subido a
      # mano por FTP al servidor (SPEC 85). El deploy ya NO genera config.local.php
      # ni maneja credenciales: solo inyecta la site key PÚBLICA de Turnstile en el
      # build (arriba). Los .htaccess de bloqueo de data/ y uploads/ viajan en dist/.

      # Deploy por SFTP (el servidor es SFTP/puerto 22, no FTP).
      # Sube el contenido de dist/ al remote_path. delete_remote_files=false:
      # NO borra archivos del servidor → data/ (submissions, counter) y uploads/
      # (adjuntos) creados en runtime se conservan siempre.
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 22
          local_path: './dist/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftp_only: true
          delete_remote_files: false
